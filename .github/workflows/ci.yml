name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same Go as the engine (gsoultan/metis), for the same advisories.
  GO_VERSION: '1.27.4'

jobs:
  ui:
    name: UI (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Some UI tests read the engine's Go source (the password rule, the node
      # types the designer must offer, the routes the SDK screen prints), so
      # the two sides cannot drift apart unnoticed.
      - name: Checkout the engine
        uses: actions/checkout@v7
        with:
          repository: gsoultan/metis
          path: .engine

      # The SDK screen's Go snippets are checked against metis-sdk's source,
      # so a snippet that would not compile fails here.
      - name: Checkout metis-sdk
        uses: actions/checkout@v7
        with:
          repository: gsoultan/metis-sdk
          path: .sdk

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # scripts/check-bundle-budget.mjs is invoked as `node ...`, and its budgets
      # are tuned to within a kilobyte of the current measurement. When no node
      # is on PATH, `bun run` answers that call with its own node shim, whose
      # zlib compresses about 0.8% worse than node's — enough to fail the
      # first-paint budget on a bundle whose bytes are identical. The hosted
      # runner had node preinstalled and hid this; a self-hosted one need not,
      # so the job asks for the runtime its budgets were measured with.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ui

      # tsgo is the TypeScript 7 native compiler. typescript@5.9 is also
      # installed purely so typescript-eslint can run — see ui/TYPESCRIPT.md.
      - name: Typecheck
        run: bun run typecheck
        working-directory: ui

      - name: Lint
        run: bun run lint
        working-directory: ui

      - name: Test
        run: bun test
        working-directory: ui
        env:
          METIS_ENGINE_DIR: ${{ github.workspace }}/.engine
          METIS_SDK_DIR: ${{ github.workspace }}/.sdk

      # `bun run build` runs the bundle budget as its final step, so a change
      # that pushes the first-paint payload past its ceiling fails here rather
      # than being noticed months later.
      - name: Build (includes bundle budget)
        run: bun run build
        working-directory: ui

      # The Go side has had govulncheck since the beginning; the UI side had
      # nothing, and a first run found 23 advisories — thirteen of them high.
      # Every one was fixable within its existing range, which is the point:
      # they were not unfixable, nobody had looked.
      #
      # Most were build-time (eslint, babel, vite) rather than shipped code.
      # That lowers the severity and not the argument: a compromised build tool
      # ships compromised assets, and the whole UI is assets.
      #
      # Two advisories are ignored, by id, because nothing we can load fixes them:
      # GHSA-gcqx-w48m-w2h4, prototype pollution in deepmerge's mergeObject()
      # (<=4.3.1, and 4.3.1 is the latest release). It reaches us through
      # vite-plugin-pwa > workbox-build > @rollup/plugin-node-resolve, which
      # merges its own options and never anything from outside. Remove the
      # --ignore once deepmerge publishes a fix.
      # GHSA-g3hv-75wg-m249, globparts amplification in minimatch (<11.0.1).
      # It reaches us through eslint 9 and eslint-plugin-jsx-a11y, which
      # default-import minimatch 3; 11 has no default export, and forcing it
      # makes lint throw "minimatch is not a function". They only match our
      # own config globs at lint time. Remove the --ignore once eslint moves
      # off minimatch 3.
      # Every other advisory still fails this step. The glob one
      # (GHSA-3g3m-2fjr-6pw4, through workbox-build) is fixed by the glob
      # override in ui/package.json, not ignored.
      - name: Dependency audit
        working-directory: ui
        run: bun audit --ignore GHSA-gcqx-w48m-w2h4 --ignore GHSA-g3hv-75wg-m249

      # The Go build embeds ui/dist (ui/embed.go). Publish it so the Go and e2e jobs
      # compiles the same assets rather than rebuilding them.
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  go:
    name: Go (fmt, vet, race, vuln, build)
    needs: ui
    runs-on: ubuntu-latest

    # The identity tables' tests run against a real PostgreSQL; without one
    # they skip, and a store that does not work would pass.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # METIS_REQUIRE_UI turns the embed test's skip into a failure, so a
      # binary without the UI in it cannot pass here.
      - name: Test (race)
        env:
          METIS_REQUIRE_UI: '1'
          METIS_TEST_POSTGRES_DSN: "host=127.0.0.1 user=metis password=metis dbname=metis_test port=5432 sslmode=disable"
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: go build -trimpath -o bin/metis-server ./cmd/metis-server

  proto-generated:
    name: Generated client matches the engine's protos
    runs-on: ubuntu-latest
    # ui/src/gen is generated from gsoultan/metis api/proto. Regenerating
    # against the engine's main and failing on any diff is what tells this
    # repository the engine's API changed under it.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the engine
        uses: actions/checkout@v7
        with:
          repository: gsoultan/metis
          path: .engine

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Pinned, as in the engine's own CI.
      - name: Setup buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      - name: Regenerate
        run: buf generate .engine/api/proto

      - name: Fail if the tree changed
        run: |
          if ! git diff --quiet -- ui/src/gen; then
            echo "::error::ui/src/gen is out of date with the engine's protos. Run 'make proto' and commit the result."
            git --no-pager diff --stat -- ui/src/gen
            exit 1
          fi
          echo "Generated client matches the engine's protos."

  e2e:
    name: End-to-end (Playwright)
    needs: ui
    runs-on: ubuntu-latest

    # The pages a person uses, driven in a browser against metis-server in
    # front of a real engine: the engine is built from gsoultan/metis main,
    # started on an empty PostgreSQL and seeded, and metis-server forwards to
    # it (e2e/README.md). The same script runs locally as `make e2e`.

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis
          POSTGRES_DB: metis_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the engine
        uses: actions/checkout@v7
        with:
          repository: gsoultan/metis
          path: .engine

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Install the suite's dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Typecheck the suite
        working-directory: e2e
        run: bun run typecheck

      - name: Install the browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run the suite
        env:
          DATABASE_URL: "postgres://metis:metis@127.0.0.1:5432/metis_e2e?sslmode=disable"
          METIS_ENGINE_DIR: ${{ github.workspace }}/.engine
        run: ./scripts/e2e.sh

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  packages:
    name: Linux packages (build, install, boot)
    runs-on: ubuntu-latest

    # The deb, rpm, apk and Arch packages are built only on a tag, so a broken
    # nfpms block, a unit that no longer starts, or a maintainer script that
    # fails on one distribution would otherwise be found on release day by
    # whoever installed it. As in the engine's CI, this builds them from the
    # same .goreleaser.yaml the release uses, installs each on its own
    # distribution, and boots the deb under the runner's real systemd with the
    # unit's hardening in force.
    #
    # The UI is built by the release's own before hook rather than taken from
    # the ui job, so the step a tag depends on is the step this proves.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GoReleaser works out the snapshot version from the last tag.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The bundle budget at the end of `bun run build` was measured with
      # node's zlib; see the ui job.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      # Both architectures, as the release builds them; only the amd64 ones
      # can be installed on this runner. sbom and sign are skipped: syft is
      # not installed here, and the keyless signature needs the release
      # workflow's OIDC identity, which a pull request does not have.
      - name: Build the packages
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sbom,sign

      - name: Install on Debian, Rocky, Alpine and Arch
        run: |
          set -euo pipefail
          # The same assertions on every distribution: the account exists, and
          # the settings ended with the owners and modes the package sets.
          cat > "$RUNNER_TEMP/check.sh" <<'SH'
          set -eu
          id metis-server
          test "$(stat -c %U:%G:%a /etc/metis-server)" = root:metis-server:750
          test "$(stat -c %U:%G:%a /etc/metis-server/metis-server.env)" = root:metis-server:640
          test -x /usr/bin/metis-server
          SH
          run() { docker run --rm -v "$PWD/dist:/d" -v "$RUNNER_TEMP/check.sh:/check.sh:ro" "$1" sh -euc "$2"; }
          run debian:12 \
            "apt-get install -y /d/*_amd64.deb; sh /check.sh; test -f /usr/lib/systemd/system/metis-server.service; apt-get purge -y metis-server"
          run rockylinux/rockylinux:9 \
            "rpm -i /d/*.x86_64.rpm; sh /check.sh; test -f /usr/lib/systemd/system/metis-server.service; rpm -e metis-server"
          run alpine:3.22 \
            "apk add --allow-untrusted /d/*_x86_64.apk; sh /check.sh; test -x /etc/init.d/metis-server; apk del metis-server"
          run archlinux:latest \
            "pacman -U --noconfirm /d/*-x86_64.pkg.tar.zst; sh /check.sh; test -f /usr/lib/systemd/system/metis-server.service; pacman -R --noconfirm metis-server"

      # No engine runs here, on purpose: /server/healthz must not follow the
      # engine's health, the app must still be served, and the forwarded API
      # must answer 502 rather than hang. That is metis-server's contract
      # (AGENTS.md section 0), checked on the installed service.
      - name: Boot the deb under systemd
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/*_amd64.deb
          sudo systemd-analyze verify metis-server.service
          sudo systemctl start metis-server
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null localhost:8080/server/healthz 2>/dev/null; then
              echo "ready after ${i}s"
              # The real app, not the 503 placeholder a build without the UI
              # serves.
              curl -fsS localhost:8080/ | grep -q '<title>Metis BPM</title>'
              code="$(curl -sS -o /dev/null -w '%{http_code}' localhost:8080/api/v1/setup/status)"
              test "$code" = 502 || { echo "::error::/api with no engine answered $code, not 502"; exit 1; }
              exit 0
            fi
            if systemctl is-failed --quiet metis-server; then
              echo "::error::The service failed instead of serving. Its log:"
              sudo journalctl -u metis-server --no-pager | tail -100
              exit 1
            fi
            sleep 1
          done
          echo "::error::/server/healthz never answered within 30s. The service log:"
          sudo journalctl -u metis-server --no-pager | tail -100
          exit 1

      - name: Stop and remove it
        if: always()
        run: |
          sudo journalctl -u metis-server --no-pager | tail -30 || true
          sudo apt-get purge -y metis-server || true
